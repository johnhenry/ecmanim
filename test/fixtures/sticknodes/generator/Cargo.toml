[package]
name = "sn-fixturegen"
version = "0.1.0"
edition = "2021"
publish = false

# Dev-only fixture generator for ecmanim's Stick Nodes importer tests.
# NOT shipped in the npm package. Uses the MIT-licensed sticknodes-rs
# (https://github.com/vinceTheProgrammer/sticknodes-rs) to WRITE figures and
# to independently READ them back.
[dependencies]
sticknodes-rs = { path = "/tmp/sticknodes-rs", features = ["std"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
